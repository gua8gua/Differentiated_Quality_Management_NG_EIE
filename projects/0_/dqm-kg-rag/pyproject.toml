[project]
name = "dqm-kg-rag"
version = "0.1.0"
description = "Quality knowledge graph tracing and lightweight GraphRAG service."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "neo4j",
  "pydantic",
  "uvicorn",
]

[project.scripts]
dqm-kg-rag = "dqm_kg_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

