[project]
name = "dqm-data-lab"
version = "0.1.0"
description = "Quality data governance and evaluation experiments for differentiated quality management."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pydantic",
  "scikit-learn",
  "scipy",
]

[project.scripts]
dqm-data-lab = "dqm_data_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

